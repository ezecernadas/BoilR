name: Windows installer

# Builds the Tauri app's NSIS installer and keeps it as a downloadable artifact,
# so a branch can be tried on Windows without a local toolchain.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  nsis:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/boilr-tauri
    steps:
    - uses: actions/checkout@v7
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/boilr-tauri
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: apps/boilr-tauri/package-lock.json
    - run: npm ci
    - name: Build the NSIS installer
      run: npx --yes @tauri-apps/cli@2 build --bundles nsis
    - uses: actions/upload-artifact@v7
      with:
        name: boilr-windows-installer
        path: apps/boilr-tauri/target/release/bundle/nsis/*.exe
        if-no-files-found: error
